# Vorela: site estático gratuito; sem função ou build.
[build]
  publish = "."

# Prévia: não permitir indexação antes da validação da marca e do conteúdo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Gera somente HTML estático, sem dependências pagas, banco ou funções.
[build]
  command = "node build.cjs && node gallery.cjs"
  publish = "dist"

# Prévia: não permitir indexação antes da validação da marca e do conteúdo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
